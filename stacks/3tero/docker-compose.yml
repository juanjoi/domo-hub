# Proyectos de impresión 3D de la familia. Sin login, como el resto del
# servidor: se llega desde la red de casa o por Tailscale.
#
# Base de datos en el PostgreSQL compartido, que se despliega antes. Sin .env
# para ella: 3tero-db-alta genera la contraseña de la aplicación y le da de alta
# su usuario y su base (ver docs/postgres.md). Usa también el traductor
# compartido (translator): los dos stacks se despliegan antes que este.
services:
  # 3tero corre con el usuario node (uid 1000): antes de arrancarlo, se crea su
  # carpeta de ficheros y se le da si no es suya.
  3tero-permisos:
    image: busybox:1.37
    container_name: 3tero-permisos
    command:
      - sh
      - -c
      - |
        mkdir -p /datos/data
        [ "$$(stat -c %u:%g /datos/data)" = 1000:1000 ] || chown -R 1000:1000 /datos/data
    volumes:
      - /docker/3tero:/datos
    network_mode: none
  # Alta en el PostgreSQL compartido: la primera vez genera la contraseña de la
  # aplicación; en cada despliegue crea el usuario y la base si no existen.
  3tero-db-alta:
    # Misma imagen que el compartido, ya descargada, por psql.
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.7
    container_name: 3tero-db-alta
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /claves-postgres/postgres ]; then
          echo "Falta el PostgreSQL compartido: hay que desplegar antes su stack" >&2
          exit 1
        fi
        if [ ! -s /claves/postgres ]; then
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /claves/postgres.nueva
          mv /claves/postgres.nueva /claves/postgres
        fi
        chown -R 1000:1000 /claves
        chmod 700 /claves
        chmod 400 /claves/postgres
        export PGHOST=postgres PGUSER=postgres PGPASSWORD="$$(cat /claves-postgres/postgres)"
        for i in $$(seq 30); do pg_isready -q && break; sleep 2; done
        psql -q -v ON_ERROR_STOP=1 -v usuario=trestero -v clave="$$(cat /claves/postgres)" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'usuario')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'usuario') \gexec
        ALTER ROLE :"usuario" PASSWORD :'clave';
        SELECT format('CREATE DATABASE %I OWNER %I', :'usuario', :'usuario')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'usuario') \gexec
        REVOKE ALL ON DATABASE :"usuario" FROM PUBLIC;
        SQL
    volumes:
      - /docker/postgres/claves:/claves-postgres:ro
      - /docker/3tero/claves:/claves
    networks:
      - db
  3tero:
    image: ghcr.io/juanjoi/3tero:1.4.0
    container_name: 3tero
    restart: unless-stopped
    depends_on:
      3tero-permisos:
        condition: service_completed_successfully
      3tero-db-alta:
        condition: service_completed_successfully
    # Lee la contraseña de la base de su fichero y lanza la orden de arranque de
    # la imagen. Si una versión nueva la cambia, hay que cambiarla aquí también.
    entrypoint:
      - sh
      - -c
      - |
        export NUXT_DATABASE_URL="postgres://trestero:$$(cat /claves/postgres)@postgres:5432/trestero"
        exec docker-entrypoint.sh node .output/server/index.mjs
    environment:
      - TZ=Europe/Madrid
      # Impresora de casa, como la nombra MakerWorld: al importar se preseleccionan
      # los perfiles laminados para ella.
      - NUXT_PUBLIC_PRINTER_MODEL=A1 mini
      # Traductor compartido, para «Traducir al español» al importar. Si no
      # responde, la aplicación funciona igual y el botón da un aviso.
      - NUXT_TRANSLATE_URL=http://translator:5000
    volumes:
      # Imágenes, modelos y miniaturas de los proyectos.
      - /docker/3tero/data:/data
      - /docker/3tero/claves:/claves:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.3tero.rule=HostRegexp(`^3tero\.`)
      - traefik.http.middlewares.3tero-menu.plugin.menu.categoria=Casa
      - traefik.http.middlewares.3tero-menu.plugin.menu.nombre=3tero
      - traefik.http.middlewares.3tero-menu.plugin.menu.icono=3tero.svg
      - traefik.http.routers.3tero.middlewares=compress@file,3tero-menu
      - traefik.http.services.3tero.loadbalancer.server.port=3000
    networks:
      - proxy
      - db
      - translator
networks:
  proxy:
    external: true
  db:
    external: true
  translator:
    external: true
