# Panel para actualizar los stacks de este repositorio con un botón.
# Controla todo Docker y no tiene login propio, así que Traefik le pone
# usuario y contraseña. Si Traefik falla, se entra con un túnel SSH al puerto
# publicado en el propio servidor.
services:
  domo-board:
    image: ghcr.io/juanjoi/domo-board:0.1.0
    container_name: domo-board
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
      - DOMO_REPO=/docker/domo-hub
      - DOMO_DATOS=/docker/domo-board
    # Solo para entrar por un túnel SSH si Traefik falla.
    ports:
      - "127.0.0.1:8099:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/salud"]
      interval: 30s
      timeout: 5s
    volumes:
      # Controla Docker para levantar los stacks.
      - /var/run/docker.sock:/var/run/docker.sock
      # Misma ruta dentro y fuera, para que las rutas de los compose se
      # resuelvan igual que en el servidor.
      - /docker:/docker
    labels:
      - traefik.enable=true
      - traefik.http.routers.domo-board.rule=HostRegexp(`^domo-board\.`)
      - traefik.http.routers.domo-board.middlewares=autenticacion@file
      - traefik.http.services.domo-board.loadbalancer.server.port=8080
    networks:
      - proxy
networks:
  proxy:
    external: true
