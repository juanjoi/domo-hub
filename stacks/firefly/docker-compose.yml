# Finanzas de la familia (Firefly III) y su importador de datos.
#
# Base de datos en el PostgreSQL compartido, que se despliega antes. Sin .env:
# firefly-db-alta genera la contraseña de la aplicación y le da de alta su
# usuario y su base (ver docs/postgres.md y docs/firefly.md).

# Conexión a la base, la misma para firefly y firefly-esquema.
x-base: &base
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: firefly
  DB_USERNAME: firefly
  # Firefly lee la contraseña y su clave de cifrado de los ficheros que deja
  # firefly-db-alta.
  DB_PASSWORD_FILE: /claves/postgres
  APP_KEY_FILE: /claves/app-key
  TZ: Europe/Madrid

services:
  # Alta en el PostgreSQL compartido: la primera vez genera la contraseña de la
  # aplicación; en cada despliegue crea el usuario y la base si no existen.
  # Prepara también la clave de cifrado y la carpeta de adjuntos, del usuario
  # con el que corre Firefly (www-data, uid 33).
  firefly-db-alta:
    # Misma imagen que el compartido, ya descargada, por psql.
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.7
    container_name: firefly-db-alta
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /claves-postgres/postgres ]; then
          echo "Falta el PostgreSQL compartido: hay que desplegar antes su stack" >&2
          exit 1
        fi
        mkdir -p /firefly/claves /firefly/upload
        if [ ! -s /firefly/claves/postgres ]; then
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /firefly/claves/postgres.nueva
          mv /firefly/claves/postgres.nueva /firefly/claves/postgres
        fi
        # Clave de cifrado de Firefly: cifra adjuntos y preferencias, así que no
        # puede cambiar. Es la de ejemplo de Firefly, la que tenía la instalación
        # anterior, para que lo ya cifrado se siga leyendo.
        if [ ! -s /firefly/claves/app-key ]; then
          printf %s SomeRandomStringOf32CharsExactly > /firefly/claves/app-key
        fi
        chown -R 33:33 /firefly/claves /firefly/upload
        chmod 700 /firefly/claves
        chmod 400 /firefly/claves/postgres /firefly/claves/app-key
        export PGHOST=postgres PGUSER=postgres PGPASSWORD="$$(cat /claves-postgres/postgres)"
        export PGOPTIONS="-c client_min_messages=warning"
        for i in $$(seq 30); do pg_isready -q && break; sleep 2; done
        psql -q -v ON_ERROR_STOP=1 -v usuario=firefly -v clave="$$(cat /firefly/claves/postgres)" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'usuario')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'usuario') \gexec
        ALTER ROLE :"usuario" PASSWORD :'clave';
        SELECT format('CREATE DATABASE %I OWNER %I', :'usuario', :'usuario')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'usuario') \gexec
        REVOKE ALL ON DATABASE :"usuario" FROM PUBLIC;
        SQL
    volumes:
      - /docker/postgres/claves:/claves-postgres:ro
      - /docker/firefly:/firefly
    networks:
      - db

  # Traspaso único desde el Firefly anterior, que usaba MariaDB. Solo actúa si
  # hay un volcado en /docker/firefly/traspaso/firefly.sql y aún no se ha hecho:
  #   1. firefly-mariadb carga el volcado en una MariaDB solo en memoria.
  #   2. firefly-esquema crea las tablas en PostgreSQL con las migraciones de
  #      Firefly, las mismas que en una instalación nueva.
  #   3. firefly-traspaso copia los datos de una a otra con pgloader, deja la
  #      marca traspaso/hecho y renombra el volcado.
  firefly-mariadb:
    image: mariadb:11
    container_name: firefly-mariadb
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: fireflyiii
    tmpfs:
      - /var/lib/mysql
    volumes:
      - /docker/firefly/traspaso:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - firefly
  firefly-esquema:
    image: fireflyiii/core:version-6.1.21
    container_name: firefly-esquema
    depends_on:
      firefly-db-alta:
        condition: service_completed_successfully
    environment: *base
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -f /traspaso/firefly.sql ] || [ -f /traspaso/hecho ]; then exit 0; fi
        export DB_PASSWORD="$$(cat /claves/postgres)" APP_KEY="$$(cat /claves/app-key)"
        unset DB_PASSWORD_FILE APP_KEY_FILE
        cd /var/www/html
        php artisan migrate:fresh --force
    volumes:
      - /docker/firefly/traspaso:/traspaso:ro
      - /docker/firefly/claves:/claves:ro
    networks:
      - db
  firefly-traspaso:
    image: ghcr.io/dimitri/pgloader:latest
    container_name: firefly-traspaso
    depends_on:
      firefly-esquema:
        condition: service_completed_successfully
      firefly-mariadb:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /traspaso/firefly.sql ] || [ -f /traspaso/hecho ]; then exit 0; fi
        cat > /tmp/traspaso.load <<EOF
        LOAD DATABASE
          FROM mysql://root@firefly-mariadb/fireflyiii
          INTO postgresql://postgres:$$(cat /claves-postgres/postgres)@postgres/firefly
        WITH data only, truncate, disable triggers, reset sequences,
             quote identifiers, no foreign keys, create no indexes,
             workers = 2, concurrency = 1
        ALTER SCHEMA 'fireflyiii' RENAME TO 'public';
        EOF
        pgloader --on-error-stop /tmp/traspaso.load
        touch /traspaso/hecho
        mv /traspaso/firefly.sql /traspaso/firefly.sql.restaurado
    volumes:
      - /docker/postgres/claves:/claves-postgres:ro
      - /docker/firefly/traspaso:/traspaso
    networks:
      - db
      - firefly

  firefly:
    image: fireflyiii/core:version-6.1.21
    container_name: firefly
    restart: unless-stopped
    depends_on:
      firefly-traspaso:
        condition: service_completed_successfully
    environment:
      <<: *base
      DEFAULT_LANGUAGE: es_ES
      DEFAULT_LOCALE: equal
      # Detrás de Traefik: confía en sus cabeceras para saber la dirección real.
      TRUSTED_PROXIES: "**"
      # Dirección de Firefly para enlaces y correos, con el dominio de casa que
      # pasa domo-board al desplegar (ver docs/operacion.md).
      APP_URL: http://firefly.${DOMINIO:-localhost}
    volumes:
      # Adjuntos de los movimientos, cifrados con APP_KEY.
      - /docker/firefly/upload:/var/www/html/storage/upload
      - /docker/firefly/claves:/claves:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.firefly.rule=HostRegexp(`^firefly\.`)
      - traefik.http.middlewares.firefly-menu.plugin.menu.categoria=Casa
      - traefik.http.middlewares.firefly-menu.plugin.menu.nombre=Firefly III
      - traefik.http.middlewares.firefly-menu.plugin.menu.icono=firefly-iii.svg
      - traefik.http.routers.firefly.middlewares=compress@file,firefly-menu
      - traefik.http.services.firefly.loadbalancer.server.port=8080
    networks:
      - proxy
      - db
      - firefly

  # Importador de datos: pide permiso a Firefly al entrar (OAuth), sin clave de
  # acceso guardada. El cliente OAuth se crea una vez en Firefly (ver
  # docs/firefly.md).
  firefly-importer:
    image: fireflyiii/data-importer:version-2.3.5
    container_name: firefly-importer
    restart: unless-stopped
    depends_on:
      - firefly
    environment:
      TZ: Europe/Madrid
      TRUSTED_PROXIES: "**"
      # Firefly por la red del stack, y la dirección con la que lo abre el
      # navegador para dar permiso.
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: http://firefly.${DOMINIO:-localhost}
    labels:
      - traefik.enable=true
      - traefik.http.routers.firefly-importer.rule=HostRegexp(`^firefly-importer\.`)
      - traefik.http.middlewares.firefly-importer-menu.plugin.menu.categoria=Casa
      - traefik.http.middlewares.firefly-importer-menu.plugin.menu.nombre=Importador de Firefly
      - traefik.http.middlewares.firefly-importer-menu.plugin.menu.icono=firefly-iii.svg
      - traefik.http.routers.firefly-importer.middlewares=compress@file,firefly-importer-menu
      - traefik.http.services.firefly-importer.loadbalancer.server.port=8080
    networks:
      - proxy
      - firefly

networks:
  proxy:
    external: true
  db:
    external: true
  firefly:
