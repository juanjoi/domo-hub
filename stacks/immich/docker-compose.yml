# Fotos y vídeos de la familia.
#
# Base de datos en el PostgreSQL compartido, que se despliega antes y usa la
# imagen de PostgreSQL de Immich. Sin .env: immich-db-alta genera la contraseña
# de la aplicación y le da de alta su usuario, su base y sus extensiones (ver
# docs/postgres.md y docs/immich.md).
services:
  # Alta en el PostgreSQL compartido: la primera vez genera la contraseña de la
  # aplicación; en cada despliegue crea el usuario, la base y las extensiones si
  # no existen. Immich no es superusuario, así que las extensiones las crea y
  # las actualiza este contenedor: si cambia la versión de VectorChord, la
  # actualiza y rehace sus índices.
  immich-db-alta:
    # Misma imagen que el compartido, ya descargada, por psql.
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.7
    container_name: immich-db-alta
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /claves-postgres/postgres ]; then
          echo "Falta el PostgreSQL compartido: hay que desplegar antes su stack" >&2
          exit 1
        fi
        if [ ! -s /claves/postgres ]; then
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /claves/postgres.nueva
          mv /claves/postgres.nueva /claves/postgres
        fi
        chmod 700 /claves
        chmod 400 /claves/postgres
        export PGHOST=postgres PGUSER=postgres PGPASSWORD="$$(cat /claves-postgres/postgres)"
        export PGOPTIONS="-c client_min_messages=warning"
        for i in $$(seq 30); do pg_isready -q && break; sleep 2; done
        psql -q -v ON_ERROR_STOP=1 -v usuario=immich -v clave="$$(cat /claves/postgres)" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'usuario')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'usuario') \gexec
        ALTER ROLE :"usuario" PASSWORD :'clave';
        SELECT format('CREATE DATABASE %I OWNER %I', :'usuario', :'usuario')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'usuario') \gexec
        REVOKE ALL ON DATABASE :"usuario" FROM PUBLIC;
        SQL
        psql -q -v ON_ERROR_STOP=1 -d immich <<'SQL'
        CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        CREATE EXTENSION IF NOT EXISTS pg_trgm;
        CREATE EXTENSION IF NOT EXISTS unaccent;
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        SQL
        antes=$$(psql -tAq -d immich -c "SELECT extversion FROM pg_extension WHERE extname = 'vchord'")
        psql -q -v ON_ERROR_STOP=1 -d immich -c "ALTER EXTENSION vector UPDATE" -c "ALTER EXTENSION vchord UPDATE"
        despues=$$(psql -tAq -d immich -c "SELECT extversion FROM pg_extension WHERE extname = 'vchord'")
        if [ "$$antes" != "$$despues" ]; then
          echo "VectorChord $$antes -> $$despues: se rehacen sus índices"
          psql -q -v ON_ERROR_STOP=1 -d immich <<'SQL'
        SELECT format('REINDEX INDEX %I', indexname) FROM pg_indexes
          WHERE indexname IN ('face_index', 'clip_index') \gexec
        SQL
        fi
    volumes:
      - /docker/postgres/claves:/claves-postgres:ro
      - /docker/immich/claves:/claves
    networks:
      - db
  # Traspaso único desde el Immich anterior: si encuentra un volcado de su base
  # en /docker/immich/traspaso.dump y la base del compartido aún no tiene
  # tablas, lo restaura y lo renombra, para no repetirlo. Sin volcado, no hace
  # nada.
  immich-traspaso:
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.7
    container_name: immich-traspaso
    depends_on:
      immich-db-alta:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - |
        set -e
        [ -f /traspaso/traspaso.dump ] || exit 0
        export PGHOST=postgres PGUSER=postgres PGPASSWORD="$$(cat /claves-postgres/postgres)"
        tablas=$$(psql -tAq -d immich -c "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")
        if [ "$$tablas" != 0 ]; then
          echo "La base immich ya tiene tablas: no se restaura el volcado encima" >&2
          exit 1
        fi
        # Sin los comentarios de las extensiones: las crea immich-db-alta y solo
        # su dueño, el superusuario, puede comentarlas.
        pg_restore -l /traspaso/traspaso.dump | grep -v ' COMMENT - EXTENSION ' > /tmp/lista
        pg_restore -d immich --no-owner --role=immich --exit-on-error -L /tmp/lista /traspaso/traspaso.dump
        echo "Traspaso hecho: $$(psql -tAq -d immich -c 'SELECT count(*) FROM asset') fotos y vídeos"
        mv /traspaso/traspaso.dump /traspaso/traspaso.dump.restaurado
    volumes:
      - /docker/postgres/claves:/claves-postgres:ro
      - /docker/immich:/traspaso
    networks:
      - db
  immich:
    image: ghcr.io/immich-app/immich-server:v2.5.6
    container_name: immich
    restart: unless-stopped
    depends_on:
      immich-traspaso:
        condition: service_completed_successfully
      immich-redis:
        condition: service_healthy
    environment:
      - TZ=Europe/Madrid
      - DB_HOSTNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_USERNAME=immich
      # Immich lee la contraseña del fichero que deja immich-db-alta.
      - DB_PASSWORD_FILE=/claves/postgres
      - REDIS_HOSTNAME=immich-redis
    volumes:
      # Fotos, vídeos, miniaturas y vídeos convertidos.
      - /docker/immich/library:/data
      - /docker/immich/claves:/claves:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=HostRegexp(`^immich\.`)
      - traefik.http.middlewares.immich-menu.plugin.menu.categoria=Media
      - traefik.http.middlewares.immich-menu.plugin.menu.nombre=Immich
      - traefik.http.middlewares.immich-menu.plugin.menu.icono=immich.svg
      - traefik.http.routers.immich.middlewares=compress@file,immich-menu
      - traefik.http.services.immich.loadbalancer.server.port=2283
    networks:
      - proxy
      - db
      - immich
  # Reconocimiento de caras y búsqueda por contenido, en la CPU. Descarga sus
  # modelos de internet la primera vez y los guarda en model-cache.
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v2.5.6
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /docker/immich/model-cache:/cache
    networks:
      - immich
  immich-redis:
    image: valkey/valkey:9.0.1
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immich
networks:
  proxy:
    external: true
  db:
    external: true
  immich:
