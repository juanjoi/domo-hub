services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: mqtt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: mosquitto -c /mosquitto-no-auth.conf
    labels:
      # Sin web: en domo-board va en esta categoría.
      - domo-board.categoria=Infraestructura
    networks:
      - mqtt
networks:
  mqtt:
    name: mqtt
