# Usuario y contraseña para lo que no tiene login propio: el panel de Traefik y
# domo-board. Una ruta lo activa con la etiqueta
#   traefik.http.routers.<servicio>.middlewares=autenticacion@file
# Las contraseñas, cifradas con htpasswd, están en el servidor y no en Git.
# Si falta el fichero, Traefik deniega el acceso a esas rutas.
http:
  middlewares:
    autenticacion:
      basicAuth:
        usersFile: /etc/traefik/secretos/usuarios
