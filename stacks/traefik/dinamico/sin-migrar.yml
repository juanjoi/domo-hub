# Servicios que aún no están en domo-hub. Traefik los alcanza por la red services.
# Al migrar uno, se borra de aquí en el mismo cambio en que se le añaden las etiquetas en su stack:
# si los dos existen a la vez, Traefik tiene dos rutas para el mismo nombre.
# Las reglas solo miran el principio del nombre, así el dominio no está en Git.
http:
  routers:
    firefly-importer:
      rule: HostRegexp(`^firefly-importer\.`)
      service: firefly-importer
    firefly:
      rule: HostRegexp(`^firefly\.`)
      service: firefly
    immich:
      rule: HostRegexp(`^immich\.`)
      service: immich
    portainer:
      rule: HostRegexp(`^portainer\.`)
      service: portainer
    recetas:
      rule: HostRegexp(`^recetas\.`)
      service: recetas
    vaultwarden:
      rule: HostRegexp(`^vaultwarden\.`)
      service: vaultwarden
    wud:
      rule: HostRegexp(`^wud\.`)
      service: wud
  services:
    firefly-importer:
      loadBalancer:
        servers:
          - url: http://firefly-importer:8080
    firefly:
      loadBalancer:
        servers:
          - url: http://firefly:8080
    immich:
      loadBalancer:
        servers:
          - url: http://immich:2283
    portainer:
      loadBalancer:
        servers:
          - url: http://portainer:9000
    recetas:
      loadBalancer:
        servers:
          - url: http://mealie:9000
    vaultwarden:
      loadBalancer:
        servers:
          - url: http://vaultwarden:80
    wud:
      loadBalancer:
        servers:
          - url: http://wud:3000
