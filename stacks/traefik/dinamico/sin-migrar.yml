# Servicios que aún no están en domo-hub. Traefik los alcanza por la red services.
# Al migrar uno, se borra de aquí en el mismo cambio en que se le añaden las etiquetas en su stack:
# si los dos existen a la vez, Traefik tiene dos rutas para el mismo nombre.
# Las reglas solo miran el principio del nombre, así el dominio no está en Git.
http:
  middlewares:
    # Menú común de cada ruta: categoría, nombre e icono (ver stacks/domo-menu).
    firefly-importer-menu:
      plugin:
        menu:
          categoria: Familia
          nombre: "Importador de Firefly"
          icono: firefly-iii.svg
    firefly-menu:
      plugin:
        menu:
          categoria: Familia
          nombre: "Firefly III"
          icono: firefly-iii.svg
    immich-menu:
      plugin:
        menu:
          categoria: Familia
          nombre: "Immich"
          icono: immich.svg
    portainer-menu:
      plugin:
        menu:
          categoria: Infraestructura
          nombre: "Portainer"
          icono: portainer.svg
    recetas-menu:
      plugin:
        menu:
          categoria: Familia
          nombre: "Recetas"
          icono: mealie.svg
    wud-menu:
      plugin:
        menu:
          categoria: Infraestructura
          nombre: "What's Up Docker"
          icono: whats-up-docker.svg
  routers:
    firefly-importer:
      rule: HostRegexp(`^firefly-importer\.`)
      service: firefly-importer
      middlewares: [compress, firefly-importer-menu]
    firefly:
      rule: HostRegexp(`^firefly\.`)
      service: firefly
      middlewares: [compress, firefly-menu]
    immich:
      rule: HostRegexp(`^immich\.`)
      service: immich
      middlewares: [compress, immich-menu]
    portainer:
      rule: HostRegexp(`^portainer\.`)
      service: portainer
      middlewares: [compress, portainer-menu]
    recetas:
      rule: HostRegexp(`^recetas\.`)
      service: recetas
      middlewares: [compress, recetas-menu]
    # Sin menú: en el gestor de contraseñas no se inserta ningún script ajeno.
    vaultwarden:
      rule: HostRegexp(`^vaultwarden\.`)
      service: vaultwarden
    wud:
      rule: HostRegexp(`^wud\.`)
      service: wud
      middlewares: [compress, wud-menu]
  services:
    firefly-importer:
      loadBalancer:
        servers:
          - url: http://firefly-importer:8080
    firefly:
      loadBalancer:
        servers:
          - url: http://firefly:8080
    immich:
      loadBalancer:
        servers:
          - url: http://immich:2283
    portainer:
      loadBalancer:
        servers:
          - url: http://portainer:9000
    recetas:
      loadBalancer:
        servers:
          - url: http://mealie:9000
    vaultwarden:
      loadBalancer:
        servers:
          - url: http://vaultwarden:80
    wud:
      loadBalancer:
        servers:
          - url: http://wud:3000
